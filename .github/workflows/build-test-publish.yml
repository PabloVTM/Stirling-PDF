name: build-test-publish

on:
  push:
    branches: [main]
    # date versions, e.g. 2026-11-08
    tags: ['[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]']
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly rebuild to pull in Ubuntu security updates (Monday 04:00 UTC)
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      today: ${{ steps.version.outputs.today }}
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Compute version and image name
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          today="$(date -u +%Y-%m-%d)"
          if [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            version="$today"
          else
            version="sha-${GITHUB_SHA::7}"
          fi
          {
            echo "today=$today"
            echo "version=$version"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stirling-pdf"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Build and smoke test image (amd64)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/embedded/Dockerfile
          load: true
          tags: stirling-pdf:test
          build-args: |
            VERSION_TAG=${{ needs.version.outputs.version }}
            STIRLING_FLAVOR=core
            BUILD_PORTAL=false
          # always rebuild from the latest base so apt upgrade picks up security fixes
          pull: true
          no-cache: true

      - name: Container becomes healthy
        timeout-minutes: 10
        run: |
          docker run -d --name spdf-test -p 8080:8080 stirling-pdf:test
          status=starting
          for _ in $(seq 120); do
            status=$(docker inspect -f '{{.State.Health.Status}}' spdf-test)
            [ "$status" = "healthy" ] && break
            [ "$(docker inspect -f '{{.State.Running}}' spdf-test)" = "true" ] || break
            sleep 5
          done
          if [ "$status" != "healthy" ]; then
            echo "container never became healthy (status: $status)"
            exit 1
          fi
          curl -sf http://localhost:8080/api/v1/info/status
          curl -sf -o /dev/null http://localhost:8080/

      - name: Merge two PDFs through the API
        run: |
          python3 - <<'PY'
          def pdf(text):
              objects = [
                  b"<< /Type /Catalog /Pages 2 0 R >>",
                  b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
                  b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 200 200] /Contents 4 0 R >>",
              ]
              stream = f"BT /F1 12 Tf 20 100 Td ({text}) Tj ET".encode()
              objects.append(b"<< /Length %d >>\nstream\n" % len(stream) + stream + b"\nendstream")
              out = bytearray(b"%PDF-1.4\n")
              offsets = []
              for number, body in enumerate(objects, 1):
                  offsets.append(len(out))
                  out += b"%d 0 obj\n" % number + body + b"\nendobj\n"
              xref = len(out)
              out += b"xref\n0 %d\n0000000000 65535 f \n" % (len(objects) + 1)
              out += b"".join(b"%010d 00000 n \n" % o for o in offsets)
              out += b"trailer\n<< /Size %d /Root 1 0 R >>\nstartxref\n%d\n%%%%EOF\n" % (len(objects) + 1, xref)
              return bytes(out)
          open("a.pdf", "wb").write(pdf("one"))
          open("b.pdf", "wb").write(pdf("two"))
          PY
          curl -sf -o merged.pdf \
            -F "fileInput=@a.pdf;type=application/pdf" \
            -F "fileInput=@b.pdf;type=application/pdf" \
            http://localhost:8080/api/v1/general/merge-pdfs
          head -c 5 merged.pdf | grep -q '%PDF-'
          # count pages with the qpdf shipped in the image (object streams hide /Type /Page)
          docker cp merged.pdf spdf-test:/tmp/merged.pdf
          pages=$(docker exec spdf-test qpdf --show-npages /tmp/merged.pdf)
          echo "merged PDF has $pages pages"
          test "$pages" -eq 2

      - name: Show container logs on failure
        if: failure()
        run: docker logs spdf-test 2>&1 | tail -200 || true

      - name: Remove test container
        if: always()
        run: docker rm -f spdf-test || true

  build:
    name: Build ${{ matrix.platform }}
    needs: [version, test]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.version.outputs.image }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/embedded/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION_TAG=${{ needs.version.outputs.version }}
            STIRLING_FLAVOR=core
            BUILD_PORTAL=false
          outputs: type=image,name=${{ needs.version.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # always rebuild from the latest base so apt upgrade picks up security fixes
          pull: true
          no-cache: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image to GHCR
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the date git tag on scheduled builds
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.version.outputs.image }}
          tags: |
            # git tag 2026-11-08 -> image tag 2026-11-08
            type=ref,event=tag
            # monday rebuild -> image tag of the day
            type=raw,value=${{ needs.version.outputs.today }},enable=${{ github.event_name == 'schedule' }}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Create and push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.version.outputs.image }}
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:$(jq -r '.tags[0] | split(":")[1]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"

      - name: Create the date git tag for scheduled builds
        if: github.event_name == 'schedule'
        # tags pushed with GITHUB_TOKEN do not re-trigger this workflow
        env:
          TAG: ${{ needs.version.outputs.today }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --tags "$remote" "refs/tags/${TAG}" >/dev/null; then
            echo "git tag ${TAG} already exists, skipping"
            exit 0
          fi
          sha="${GITHUB_SHA}"
          git init -q tagger && cd tagger
          git fetch -q --depth=1 "$remote" "$sha"
          git tag "${TAG}" "$sha"
          git push "$remote" "refs/tags/${TAG}"
